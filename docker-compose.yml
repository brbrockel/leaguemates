# Local development services. Start with `pnpm dev:services`.
# Uncommon host ports, so nothing collides with apps on this machine (or on
# Windows, which WSL forwards localhost ports to).
name: teemate-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: teemate
      POSTGRES_PASSWORD: teemate
      POSTGRES_DB: teemate
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teemate']
      interval: 5s
      retries: 10

  # Catches every email locally; inbox at http://localhost:18025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'

volumes:
  postgres-data:
    # Explicit dev-only name; the production stack uses its own volume (teemate_prod-db).
    name: teemate_postgres-data
