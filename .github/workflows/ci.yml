name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: teemate
          POSTGRES_PASSWORD: teemate
          POSTGRES_DB: teemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teemate"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://teemate:teemate@localhost:5432/teemate_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @teemate/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
